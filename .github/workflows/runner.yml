name: runner

on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: lx-runner
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: itsmkop/itsmkop
          token: ${{ secrets.GH_PAT }}
      - run: python3 bot.py
      - name: chain next run
        if: ${{ !cancelled() }}
        run: |
          sleep 3
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/itsmkop/lx-runner/actions/workflows/runner.yml/dispatches \
            -d '{"ref":"main"}'
